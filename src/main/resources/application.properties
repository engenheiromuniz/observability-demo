spring.application.name=observability-demo

# Adiciona a etiqueta "application" em toda métrica exportada — é isso
# que o dashboard pronto do Grafana usa para preencher o filtro "Application".
management.metrics.tags.application=${spring.application.name}

# Habilita os grupos de health check padrao do Spring Boot para
# Kubernetes: /actuator/health/liveness e /actuator/health/readiness
management.endpoint.health.probes.enabled=true


# Expoe os endpoints do Actuator que vamos explorar.
# Por padrao, so 'health' fica exposto - aqui ligamos os demais
# de proposito, para fins de estudo (em producao, exponha so o necessario).
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Mostra detalhes no /actuator/health (status de disco, ping, etc.)
# em vez de so "UP"/"DOWN" generico.
management.endpoint.health.show-details=always

# Habilita o endpoint /actuator/prometheus (formato que Prometheus/Grafana
# leem nativamente).
management.prometheus.metrics.export.enabled=true